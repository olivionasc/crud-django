{% extends 'funcionarios/base.html' %}

{% block content %}
<div class="row g-4 justify-content-center">
    <!-- SIDEBAR DE SUGESTÕES -->
    <div class="col-lg-4 col-md-5">
        <div class="card-modern h-100 d-flex flex-column">
            <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-lightbulb text-warning" viewBox="0 0 16 16">
                    <path d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13h-5a.5.5 0 0 1-.46-.302l-.761-1.77a1.963 1.963 0 0 0-.453-.618A5.984 5.984 0 0 1 2 6zm3 8.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/>
                </svg>
                Sugestões de Perguntas
            </h5>
            <p class="text-muted small">Clique em uma sugestão abaixo para enviá-la automaticamente ao chatbot:</p>
            <div class="d-flex flex-column gap-2 overflow-y-auto" style="max-height: 480px; padding-right: 4px;">
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Resumo da empresa</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Funcionários por setor</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Distribuição por cargo</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Contratações ao longo do tempo</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Salário médio por setor</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Quem trabalha no RH?</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Qual o maior salário?</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Quantos funcionários existem?</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Mostre os dados de João Silva</button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start py-2 px-3 suggestion-btn">Listar todos os funcionários</button>

            </div>
        </div>
    </div>

    <!-- JANELA DE CHAT -->
    <div class="col-lg-8 col-md-7">
        <div class="card-modern d-flex flex-column" style="height: 600px;">
            <div class="d-flex justify-content-between align-items-center pb-3 border-bottom mb-3">
                <div>
                    <h5 class="fw-bold mb-0 d-flex align-items-center gap-2">
                        <span class="chat-status-indicator"></span>
                        Assistente Inteligente
                    </h5>
                    <small class="text-muted">NLP local baseado em regras</small>
                </div>
                <button type="button" class="btn btn-outline-danger btn-sm px-3 d-flex align-items-center gap-1" id="clearChatBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47ZM8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5Z"/>
                    </svg>
                    Limpar Conversa
                </button>
            </div>

            <!-- CORPO DO HISTÓRICO -->
            <div class="flex-grow-1 overflow-y-auto mb-3 pe-2" id="chatHistory" style="scroll-behavior: smooth;">
                <!-- As mensagens serão inseridas aqui dinamicamente -->
            </div>

            <!-- INDICADOR DE CARREGAMENTO -->
            <div id="chatLoading" class="d-none mb-3 px-3 py-2 bg-light rounded-pill align-self-start text-muted small d-flex align-items-center gap-2">
                <span class="spinner-grow spinner-grow-sm text-primary" role="status"></span>
                <span>Pensando...</span>
            </div>

            <!-- FORMULÁRIO DE INPUT -->
            <form id="chatForm" class="mt-auto">
                <div class="input-group">
                    <input type="text" id="chatInput" class="form-control" placeholder="Faça uma pergunta sobre os funcionários..." required autocomplete="off">
                    <button type="submit" class="btn btn-dashboard px-4" id="sendBtn">
                        Enviar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    /* Status indicator style */
    .chat-status-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        background-color: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
    }

    /* Message bubbles */
    .chat-msg {
        max-width: 75%;
        margin-bottom: 1rem;
        padding: 12px 18px;
        border-radius: 16px;
        word-wrap: break-word;
        white-space: pre-line;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .chat-msg-user {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .chat-msg-bot {
        background-color: #f1f5f9;
        color: #1e293b;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        border: 1px solid #e2e8f0;
    }

    /* Suggestions button hover */
    .suggestion-btn {
        transition: all 0.2s ease-in-out;
        border-radius: 10px;
        font-weight: 500;
        background-color: #f8fafc;
        border-color: #e2e8f0;
        color: #475569;
    }

    .suggestion-btn:hover {
        background-color: #e2e8f0;
        color: #0f172a;
        transform: translateX(4px);
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const chatHistory = document.getElementById("chatHistory");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const chatLoading = document.getElementById("chatLoading");
    const clearChatBtn = document.getElementById("clearChatBtn");
    const suggestionBtns = document.querySelectorAll(".suggestion-btn");

    // Mensagem de boas-vindas padrão
    const WELCOME_MESSAGE = {
        sender: "bot",
        data: {
            type: "text",
            text: "Olá! Eu sou o assistente inteligente do sistema.\n\nVocê pode me fazer perguntas como:\n- *'Quantos funcionários trabalham no RH?'*\n- *'Qual o salário médio da TI?'*\n- *'Distribuição por cargo'* (Gráfico)\n- *'Resumo da empresa'* (Dashboard Completo)\n\nComo posso ajudar você agora?",
            components: []
        }
    };

    // Carregar histórico do localStorage ou iniciar com boas-vindas
    let history = JSON.parse(localStorage.getItem("chat_history")) || [WELCOME_MESSAGE];

    function renderHistory() {
        chatHistory.innerHTML = "";
        history.forEach(msg => {
            if (msg.sender === 'user') {
                appendMessageUI(msg.sender, msg.text, false);
            } else {
                appendMessageUI(msg.sender, msg.data || msg.text, false);
            }
        });
        scrollToBottom();
    }

    function saveHistory() {
        localStorage.setItem("chat_history", JSON.stringify(history));
    }

    function initChart(canvasId, type, chartData) {
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;

        const colors = ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#3b82f6', '#14b8a6', '#f43f5e'];
        const chartType = type === 'bar-chart' ? 'bar' : (type === 'pie-chart' ? 'pie' : 'line');

        const datasets = chartData.datasets.map((ds, idx) => {
            const base = {
                label: ds.label,
                data: ds.data,
            };
            if (chartType === 'pie') {
                base.backgroundColor = colors.slice(0, ds.data.length);
            } else if (chartType === 'bar') {
                base.backgroundColor = '#2563eb';
                base.borderRadius = 6;
            } else if (chartType === 'line') {
                base.backgroundColor = 'rgba(37, 99, 235, 0.05)';
                base.borderColor = '#2563eb';
                base.borderWidth = 2;
                base.fill = true;
                base.tension = 0.3;
            }
            return base;
        });

        new Chart(ctx, {
            type: chartType,
            data: {
                labels: chartData.labels,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: chartType === 'pie',
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            padding: 8
                        }
                    }
                },
                scales: chartType !== 'pie' ? {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f1f5f9' }
                    },
                    x: {
                        grid: { display: false }
                    }
                } : undefined
            }
        });
    }

    function appendMessageUI(sender, messageObj, animate = true) {
        const wrapper = document.createElement("div");
        wrapper.className = "d-flex flex-column w-100 mb-3";

        let text = "";
        let components = [];
        let responseType = "text";

        if (sender === 'user') {
            text = typeof messageObj === 'string' ? messageObj : (messageObj.text || "");
        } else {
            if (typeof messageObj === 'string') {
                text = messageObj;
            } else if (messageObj && typeof messageObj === 'object') {
                text = messageObj.text || "";
                components = messageObj.components || [];
                responseType = messageObj.type || "text";
            }
        }

        const bubble = document.createElement("div");
        bubble.className = `chat-msg ${sender === 'user' ? 'chat-msg-user align-self-end' : 'chat-msg-bot align-self-start'}`;

        let formattedText = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');

        bubble.innerHTML = formattedText;
        wrapper.appendChild(bubble);

        // Render visual components
        if (sender === 'bot' && components.length > 0) {
            const compContainer = document.createElement("div");
            compContainer.className = "align-self-start w-100 mt-2 pe-md-4";

            if (responseType === 'dashboard') {
                const dashTitle = document.createElement("h6");
                dashTitle.className = "fw-bold text-dark mb-3 mt-1 px-1";
                dashTitle.innerText = "Dashboard Analítico Completo";
                compContainer.appendChild(dashTitle);

                const kpiGrid = document.createElement("div");
                kpiGrid.className = "row row-cols-2 row-cols-sm-3 g-2 mb-3 px-1";

                const chartGrid = document.createElement("div");
                chartGrid.className = "row row-cols-1 row-cols-md-2 g-3 px-1";

                components.forEach(comp => {
                    if (comp.type === 'kpi') {
                        const col = document.createElement("div");
                        col.className = "col";
                        col.innerHTML = `
                            <div class="kpi-card p-3 h-100" style="background: linear-gradient(135deg, #1e293b, #334155); box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-radius: 12px;">
                                <div class="kpi-number" style="font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${comp.value}</div>
                                <div class="kpi-label" style="font-size: 0.8rem; opacity: 0.8;">${comp.title}</div>
                            </div>
                        `;
                        kpiGrid.appendChild(col);
                    } else if (comp.type.endsWith('-chart')) {
                        const col = document.createElement("div");
                        col.className = "col";
                        const chartId = 'chart-' + Math.random().toString(36).substr(2, 9);
                        col.innerHTML = `
                            <div class="dashboard-card p-3 h-100" style="border: 1px solid #e2e8f0;">
                                <h6 class="fw-bold mb-2 small text-uppercase text-muted" style="font-size: 0.75rem;">${comp.title}</h6>
                                <div style="position: relative; height: 160px; width: 100%;">
                                    <canvas id="${chartId}"></canvas>
                                </div>
                            </div>
                        `;
                        chartGrid.appendChild(col);
                        setTimeout(() => initChart(chartId, comp.type, comp.data), 100);
                    }
                });

                if (kpiGrid.children.length > 0) compContainer.appendChild(kpiGrid);
                if (chartGrid.children.length > 0) compContainer.appendChild(chartGrid);

            } else {
                components.forEach(comp => {
                    if (comp.type === 'kpi') {
                        const kpiDiv = document.createElement("div");
                        kpiDiv.className = "mb-2 px-1";
                        kpiDiv.innerHTML = `
                            <div class="kpi-card p-3" style="max-width: 300px; border-radius: 12px;">
                                <div class="kpi-number" style="font-size: 1.5rem;">${comp.value}</div>
                                <div class="kpi-label" style="font-size: 0.85rem;">${comp.title}</div>
                            </div>
                        `;
                        compContainer.appendChild(kpiDiv);
                    } else if (comp.type === 'table') {
                        const tableDiv = document.createElement("div");
                        tableDiv.className = "table-responsive mb-3 table-modern mt-1 px-1";
                        tableDiv.style.maxWidth = "640px";
                        tableDiv.style.borderRadius = "12px";
                        tableDiv.style.border = "1px solid #cbd5e1";
                        tableDiv.innerHTML = `
                            <table class="table table-striped table-hover table-bordered align-middle mb-0 small">
                                <thead class="table-dark">
                                    <tr>
                                        ${comp.headers.map(h => `<th class="p-2" style="font-size: 0.8rem;">${h}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${comp.rows.map(row => `
                                        <tr>
                                            ${row.map(cell => `<td class="p-2" style="font-size: 0.8rem;">${cell}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;
                        compContainer.appendChild(tableDiv);
                    } else if (comp.type === 'card') {
                        const cardDiv = document.createElement("div");
                        cardDiv.className = "mb-3 px-1";
                        cardDiv.innerHTML = `
                            <div class="card p-3 shadow-sm" style="max-width: 380px; border-radius: 14px; border: 1px solid #cbd5e1;">
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; background: linear-gradient(135deg, #2563eb, #1d4ed8); font-size: 1rem;">
                                        ${comp.data.nome.charAt(0)}
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.95rem;">${comp.data.nome}</h6>
                                        <span class="badge ${comp.data.ativo === 'Ativo' ? 'bg-success' : 'bg-secondary'} mt-1 small" style="font-size: 0.7rem; padding: 4px 8px;">${comp.data.ativo}</span>
                                    </div>
                                </div>
                                <div class="mt-2 text-muted small" style="line-height: 1.5; font-size: 0.8rem;">
                                    <div><strong>Cargo:</strong> ${comp.data.cargo}</div>
                                    <div><strong>Departamento:</strong> ${comp.data.setor}</div>
                                    <div><strong>Salário:</strong> ${comp.data.salario}</div>
                                    <div><strong>Admissão:</strong> ${comp.data.admissao}</div>
                                    <div><strong>Telefone:</strong> ${comp.data.telefone}</div>
                                    <div><strong>E-mail:</strong> ${comp.data.email}</div>
                                </div>
                            </div>
                        `;
                        compContainer.appendChild(cardDiv);
                    } else if (comp.type === 'list') {
                        const listDiv = document.createElement("div");
                        listDiv.className = "card p-3 mb-3 shadow-sm px-1";
                        listDiv.style.maxWidth = "440px";
                        listDiv.style.borderRadius = "12px";
                        listDiv.style.border = "1px solid #cbd5e1";
                        listDiv.innerHTML = `
                            <h6 class="fw-bold text-dark mb-2 small text-uppercase" style="font-size: 0.75rem;">${comp.title}</h6>
                            <ul class="list-group list-group-flush small">
                                ${comp.items.map(item => `
                                    <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2">
                                        <div>
                                            <div class="fw-bold text-dark" style="font-size: 0.85rem;">${item.nome}</div>
                                            <div class="text-muted" style="font-size: 0.75rem;">${item.cargo}</div>
                                        </div>
                                        <span class="badge bg-secondary text-white" style="font-size: 0.7rem;">${item.setor}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        `;
                        compContainer.appendChild(listDiv);
                    } else if (comp.type.endsWith('-chart')) {
                        const chartDiv = document.createElement("div");
                        chartDiv.className = "dashboard-card p-3 mb-3";
                        chartDiv.style.maxWidth = "480px";
                        chartDiv.style.border = "1px solid #e2e8f0";
                        const chartId = 'chart-' + Math.random().toString(36).substr(2, 9);
                        chartDiv.innerHTML = `
                            <h6 class="fw-bold mb-2 text-dark small text-uppercase text-muted" style="font-size: 0.75rem;">${comp.title}</h6>
                            <div style="position: relative; height: 200px; width: 100%;">
                                <canvas id="${chartId}"></canvas>
                            </div>
                        `;
                        compContainer.appendChild(chartDiv);
                        setTimeout(() => initChart(chartId, comp.type, comp.data), 100);
                    }
                });
            }

            wrapper.appendChild(compContainer);
        }

        chatHistory.appendChild(wrapper);

        if (animate) {
            bubble.style.opacity = 0;
            bubble.style.transform = "translateY(10px)";
            bubble.style.transition = "all 0.3s ease";
            setTimeout(() => {
                bubble.style.opacity = 1;
                bubble.style.transform = "translateY(0)";
            }, 50);
        }
    }

    function scrollToBottom() {
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function sendMessage(text) {
        if (!text.trim()) return;

        // Adiciona mensagem do usuário
        const userMsg = { sender: "user", text: text };
        history.push(userMsg);
        appendMessageUI("user", text);
        saveHistory();
        scrollToBottom();

        // Limpa input
        chatInput.value = "";

        // Mostra loading
        chatLoading.classList.remove("d-none");
        scrollToBottom();

        try {
            const response = await fetch("/chat/api/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ message: text })
            });

            if (response.ok) {
                const data = await response.json();
                const botMsg = { sender: "bot", data: data };
                history.push(botMsg);
                appendMessageUI("bot", data);
                saveHistory();
            } else {
                throw new Error("Erro na requisição");
            }
        } catch (error) {
            const errorMsg = { 
                sender: "bot", 
                data: {
                    type: "text",
                    text: "Erro: Não foi possível obter resposta do servidor local. Certifique-se de que o servidor está rodando.",
                    components: []
                }
            };
            history.push(errorMsg);
            appendMessageUI("bot", errorMsg.data);
            saveHistory();
        } finally {
            chatLoading.classList.add("d-none");
            scrollToBottom();
        }
    }

    // Event Listeners
    chatForm.addEventListener("submit", function(e) {
        e.preventDefault();
        sendMessage(chatInput.value);
    });

    clearChatBtn.addEventListener("click", function() {
        if (confirm("Tem certeza de que deseja limpar todo o histórico da conversa?")) {
            history = [WELCOME_MESSAGE];
            saveHistory();
            renderHistory();
        }
    });

    suggestionBtns.forEach(btn => {
        btn.addEventListener("click", function() {
            sendMessage(btn.textContent.trim());
        });
    });

    // Inicialização
    renderHistory();
});
</script>
{% endblock %}
